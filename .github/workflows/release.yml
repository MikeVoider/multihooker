name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "MultiHooker ${GITHUB_REF_NAME}" \
            --notes "**MultiHooker ${GITHUB_REF_NAME}** for Minecraft 1.21.1 (NeoForge 21.1.x).

          Download the jar below, or grab it from [CurseForge](https://www.curseforge.com/minecraft/mc-mods/multihooker).

          ### Install
          1. Install [NeoForge](https://neoforged.net/) for Minecraft 1.21.1.
          2. Drop the jar into your \`mods\` folder.

          Found a bug? [Open an issue](https://github.com/MikeVoider/multihooker/issues/new/choose)." \
            --generate-notes \
            build/libs/*.jar
